name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check

      # Reports support-matrix drift against the harnesses installed on the
      # runner. GitHub-hosted runners have neither harness, so every capability
      # is recorded as unverified and this passes. It gates for real on a
      # self-hosted runner, and it proves the probe itself still runs.
      - run: npm run check:drift
